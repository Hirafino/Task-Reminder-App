<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#18358B">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1524">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Task Reminder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#16213a;--muted:#5b667d;--line:#d5dbe5;--accent:#18358B;--accent-ink:#fff;--bang:#f4b400;--bang-ink:#3a2a00;--late:#d6343b;--ok:#1d8a6a;--sel:#e4eaf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--surface:#18203a;--ink:#e8ecf7;--muted:#9aa5bf;--line:#2c3656;--accent:#7f9ee6;--accent-ink:#0b1230;--bang:#f4b400;--bang-ink:#2b2000;--late:#ff6b72;--ok:#4fd1a5;--sel:#22325f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18203a;--ink:#e8ecf7;--muted:#9aa5bf;--line:#2c3656;--accent:#7f9ee6;--accent-ink:#0b1230;--bang:#f4b400;--bang-ink:#2b2000;--late:#ff6b72;--ok:#4fd1a5;--sel:#22325f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.top{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--late)}
.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.cal,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{margin:0;font-size:1.2rem;font-weight:600}
.nav{display:flex;gap:6px}
.nav .btn{padding:6px 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--muted);font-size:.8rem;padding:4px 0;font-weight:600}
.day{position:relative;aspect-ratio:1/1;min-height:44px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;display:flex;align-items:flex-start;justify-content:flex-start;padding:6px 8px;font-weight:600}
.day:hover{background:var(--sel)}
.day.other{color:var(--muted);opacity:.55}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.bang{position:absolute;right:5px;bottom:5px;min-width:22px;height:22px;border-radius:50%;background:var(--bang);color:var(--bang-ink);font-weight:800;display:grid;place-items:center;font-size:.95rem;line-height:1}
.bang.late{background:var(--late);color:#fff}
.panel h2{margin:0 0 2px;font-size:1.15rem}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.task .body{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .m{font-size:.85rem;color:var(--muted)}
.task .n{font-size:.85rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:18px 4px}
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h2{margin:0 0 14px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:30;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.toast button{background:none;border:0;color:inherit;font-weight:800;cursor:pointer}
.err{color:var(--late);font-size:.85rem;min-height:1.2em;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
[hidden]{display:none!important}
.switch{display:flex;align-items:center;gap:10px;margin:16px 0 4px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.modal.view #fTitle,.modal.view #fNotes{border-color:transparent;background:transparent;cursor:text}
.modal.view #fTitle{font-weight:600;font-size:1.1rem}
.modal.view input:disabled,.modal.view select:disabled{opacity:1;color:var(--ink)}
.round{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.round:hover{border-color:var(--accent);opacity:.9}
.round svg{width:22px;height:22px}
.bang.inl{position:static;margin-left:auto;flex:none}
.task.soon{border-left:4px solid var(--bang);background:rgba(244,180,0,.12)}
.task.late{border-left:4px solid var(--late);background:rgba(214,52,59,.08)}
@media (prefers-reduced-motion:no-preference){
@keyframes spinin{from{transform:rotate(-270deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.round svg.spin{animation:spinin .5s cubic-bezier(.2,.8,.3,1)}
#allList.anim .task{animation:drop .38s ease-out both;animation-delay:calc(var(--i,0)*70ms)}
.layout.anim{animation:fadein .35s ease-out}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Task Reminder</h1>
    <div class="top">
      <button class="btn round" id="viewBtn" type="button"></button>
      <button class="btn" id="notifBtn" type="button">Aktifkan notifikasi</button>
      <button class="btn primary" id="addBtn" type="button">+ Tambah tugas</button>
    </div>
  </header>
  <div class="layout">
    <section class="cal" aria-label="Kalender">
      <div class="calhead">
        <h2 id="monthLabel"></h2>
        <div class="nav">
          <button class="btn" id="prev" type="button" aria-label="Bulan sebelumnya">‹</button>
          <button class="btn" id="todayBtn" type="button">Hari ini</button>
          <button class="btn" id="next" type="button" aria-label="Bulan berikutnya">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="panel" aria-live="polite">
      <h2 id="dayTitle"></h2>
      <div class="sub" id="daySub"></div>
      <div id="list"></div>
    </section>
  </div>
  <section class="panel" id="allView" hidden aria-live="polite">
    <h2>Semua tugas</h2>
    <div id="allList"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Tugas baru</h2>
    <label for="fTitle">Judul tugas</label>
    <input type="text" id="fTitle" maxlength="120" placeholder="Contoh: Kumpulkan laporan">
    <label for="fDate">Tenggat (tanggal)</label>
    <input type="date" id="fDate">
    <label class="switch"><input type="checkbox" id="fOn"><span>Aktifkan pengingat</span></label>
    <div id="remindBox">
      <label for="fDays">Atur pengingat</label>
      <select id="fDays"></select>
      <div class="hint">Pengingat muncul pukul 08.00 pada hari yang dipilih.</div>
    </div>
    <label for="fNotes">Catatan</label>
    <textarea id="fNotes" placeholder="Tulis detail, sub-tugas, atau tautan di sini"></textarea>
    <div class="hint" id="viewHint" hidden>Ketuk judul atau catatan untuk mengubahnya.</div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button class="btn danger left" id="delBtn" type="button">Hapus</button>
      <button class="btn" id="cancelBtn" type="button">Batal</button>
      <button class="btn primary" id="saveBtn" type="button">Simpan tugas</button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
var KEY='pengingat-tugas-v1';
var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var DOW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
var tasks=[];
try{var raw=localStorage.getItem(KEY);if(raw)tasks=JSON.parse(raw)||[]}catch(e){tasks=[]}
tasks.forEach(function(t){if(t.on===undefined){t.on=true;t.days=Math.floor((t.remind||0)/1440)}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function due(t){var p=t.date.split('-');return new Date(+p[0],+p[1]-1,+p[2],23,59,59)}
function remindAt(t){var p=t.date.split('-');return new Date(+p[0],+p[1]-1,+p[2]-(t.days||0),8,0,0)}
function remindText(t){return t.on?((t.days||0)===0?'ingatkan pada hari tenggat':'ingatkan '+t.days+' hari sebelumnya'):'pengingat nonaktif'}
function $(id){return document.getElementById(id)}

var today=new Date(),view=new Date(today.getFullYear(),today.getMonth(),1),selected=ymd(today),editing=null;

function dayTasks(d){return tasks.filter(function(t){return t.date===d}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'')})}

function renderCal(){
  $('monthLabel').textContent=MONTHS[view.getMonth()]+' '+view.getFullYear();
  var g=$('grid');g.innerHTML='';
  DOW.forEach(function(d){var e=document.createElement('div');e.className='dow';e.textContent=d;g.appendChild(e)});
  var first=new Date(view.getFullYear(),view.getMonth(),1);
  var offset=(first.getDay()+6)%7;
  var start=new Date(view.getFullYear(),view.getMonth(),1-offset);
  var todayStr=ymd(new Date()),now=new Date();
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),s=ymd(d);
    var b=document.createElement('button');b.type='button';
    b.className='day'+(d.getMonth()!==view.getMonth()?' other':'')+(s===todayStr?' today':'')+(s===selected?' sel':'');
    var active=dayTasks(s).filter(function(t){return !t.done});
    b.textContent=d.getDate();
    var label=d.getDate()+' '+MONTHS[d.getMonth()]+(active.length?', '+active.length+' tugas aktif':'');
    b.setAttribute('aria-label',label);
    if(active.length){
      var late=active.some(function(t){return due(t)<now});
      var bang=document.createElement('span');bang.className='bang'+(late?' late':'');bang.textContent='!';bang.setAttribute('aria-hidden','true');
      b.appendChild(bang);
    }
    b.addEventListener('click',(function(s,d){return function(){selected=s;if(d.getMonth()!==view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1)}render()}})(s,d));
    g.appendChild(b);
  }
}

function renderList(){
  var d=parseYmd(selected);
  $('dayTitle').textContent=d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
  var list=dayTasks(selected),active=list.filter(function(t){return !t.done}).length;
  $('daySub').textContent=list.length?(active+' dari '+list.length+' tugas belum selesai'):'Belum ada tugas';
  var el=$('list');
  if(!list.length){el.innerHTML='<div class="empty">Tidak ada tugas di tanggal ini. Tekan Tambah tugas untuk membuat satu.</div>';return}
  el.innerHTML=list.map(function(t){
    var r='';
    return '<div class="task'+(t.done?' done':'')+'"><input type="checkbox" data-id="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Tandai selesai: '+esc(t.title)+'">'+
    '<button class="body" type="button" data-open="'+t.id+'"><div class="t">'+esc(t.title)+'</div>'+
    (t.notes?'<div class="n">'+esc(t.notes.split('\n')[0])+'</div>':'')+'</button></div>';
  }).join('');
}

var mode='cal';
var ICON_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
var ICON_LIST='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>';
function allRow(t){
  var d=parseYmd(t.date),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var diff=Math.round((d-t0)/86400000),cls='',rel,flag='';
  if(t.done){rel='selesai'}
  else if(due(t)<now){cls=' late';rel='terlambat';flag='<span class="bang late inl" aria-hidden="true">!</span>'}
  else{rel=diff===0?'hari ini':diff===1?'besok':diff+' hari lagi';if(diff<=2){cls=' soon';flag='<span class="bang inl" aria-hidden="true">!</span>'}}
  var label=DOW[(d.getDay()+6)%7]+', '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getFullYear();
  return '<div class="task'+(t.done?' done':'')+cls+'"><input type="checkbox" data-id="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Tandai selesai: '+esc(t.title)+'">'+
  '<button class="body" type="button" data-open="'+t.id+'"><div class="t">'+esc(t.title)+'</div><div class="m">'+label+' · '+rel+'</div>'+
  (t.notes?'<div class="n">'+esc(t.notes.split('\n')[0])+'</div>':'')+'</button>'+flag+'</div>';
}
function renderAll(){
  var byDue=function(a,b){return due(a)-due(b)};
  var act=tasks.filter(function(t){return !t.done}).sort(byDue);
  $('allList').innerHTML=act.length?act.map(allRow).join(''):'<div class="empty">Tidak ada tugas aktif. Tekan Tambah tugas untuk membuat satu.</div>';
}
function applyMode(){
  var list=mode==='list';
  document.querySelector('.layout').hidden=list;$('allView').hidden=!list;
  var b=$('viewBtn');b.innerHTML=list?ICON_LIST:ICON_CAL;
  var txt=list?'Tampilan daftar. Ketuk untuk beralih ke kalender':'Tampilan kalender. Ketuk untuk beralih ke daftar';
  b.setAttribute('aria-label',txt);b.title=txt;
}
function render(){renderCal();renderList();renderAll();applyMode()}
$('viewBtn').addEventListener('click',function(){
  mode=mode==='cal'?'list':'cal';applyMode();
  var svg=$('viewBtn').querySelector('svg'),al=$('allList'),ly=document.querySelector('.layout');
  [].forEach.call(al.children,function(el,i){el.style.setProperty('--i',i)});
  if(svg){svg.classList.remove('spin');void svg.getBoundingClientRect();svg.classList.add('spin')}
  var target=mode==='list'?al:ly;target.classList.remove('anim');void target.offsetWidth;target.classList.add('anim');
  setTimeout(function(){target.classList.remove('anim')},500+al.children.length*70);
});
$('allList').addEventListener('click',function(e){var o=e.target.closest('[data-open]');if(o){openModal(o.getAttribute('data-open'))}});
$('allList').addEventListener('change',function(e){var id=e.target.getAttribute('data-id');if(!id)return;var t=tasks.find(function(x){return x.id===id});if(t){t.done=e.target.checked;save();render()}});

$('list').addEventListener('click',function(e){
  var o=e.target.closest('[data-open]');if(o){openModal(o.getAttribute('data-open'))}
});
$('list').addEventListener('change',function(e){
  var id=e.target.getAttribute('data-id');if(!id)return;
  var t=tasks.find(function(x){return x.id===id});if(t){t.done=e.target.checked;save();render()}
});

(function(){var s=$('fDays');[0,1,2,3,4,5,6,7,10,14,30].forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n===0?'Pada hari tenggat':n+' hari sebelum tenggat';s.appendChild(o)})})();
function syncRemind(){$('remindBox').hidden=!$('fOn').checked}
$('fOn').addEventListener('change',syncRemind);
var viewMode=false;
function setMode(v){
  viewMode=v;document.querySelector('.modal').classList.toggle('view',v);
  $('fTitle').readOnly=v;$('fNotes').readOnly=v;$('fDate').disabled=v;$('fOn').disabled=v;$('fDays').disabled=v;
  $('saveBtn').hidden=v;$('viewHint').hidden=!v;$('cancelBtn').textContent=v?'Tutup':'Batal';
}
function enterEdit(e){if(!viewMode)return;setMode(false);if(e&&e.currentTarget&&e.currentTarget.focus)e.currentTarget.focus()}
$('fTitle').addEventListener('click',enterEdit);
$('fNotes').addEventListener('click',enterEdit);
document.querySelector('.modal').addEventListener('click',function(e){if(viewMode&&e.target.closest('#remindBox,.switch,label[for=fDate],label[for=fDays],#fDate,#fDays'))setMode(false)});
function openModal(id){
  editing=id||null;
  var t=id?tasks.find(function(x){return x.id===id}):null;
  $('mTitle').textContent=t?'Detail tugas':'Tugas baru';
  $('fTitle').value=t?t.title:'';
  $('fDate').value=t?t.date:selected;
  $('fOn').checked=t?!!t.on:true;
  $('fDays').value=String(t?(t.days||0):1);
  syncRemind();
  $('fNotes').value=t?t.notes||'':'';
  setMode(!!t);
  $('delBtn').style.display=t?'':'none';
  $('err').textContent='';
  $('overlay').classList.add('open');
  if(!t)setTimeout(function(){$('fTitle').focus()},30);
}
function closeModal(){$('overlay').classList.remove('open');editing=null}

$('addBtn').addEventListener('click',function(){openModal()});
$('cancelBtn').addEventListener('click',closeModal);
$('overlay').addEventListener('click',function(e){if(e.target===$('overlay'))closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

$('saveBtn').addEventListener('click',function(){
  var title=$('fTitle').value.trim(),date=$('fDate').value;
  if(!title){$('err').textContent='Isi judul tugas terlebih dahulu.';return}
  if(!date){$('err').textContent='Pilih tanggal tenggat.';return}
  var data={title:title,date:date,on:$('fOn').checked,days:+$('fDays').value,notes:$('fNotes').value};
  if(editing){
    var t=tasks.find(function(x){return x.id===editing});
    if(t){var changed=t.date!==date||t.on!==data.on||t.days!==data.days;Object.assign(t,data);if(changed)t.notified=false}
  }else{
    data.id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);data.done=false;data.notified=false;tasks.push(data);
  }
  save();selected=date;var d=parseYmd(date);view=new Date(d.getFullYear(),d.getMonth(),1);
  closeModal();render();checkReminders();
});
$('delBtn').addEventListener('click',function(){
  if(!editing)return;
  tasks=tasks.filter(function(x){return x.id!==editing});save();closeModal();render();
});

$('prev').addEventListener('click',function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()});
$('next').addEventListener('click',function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()});
$('todayBtn').addEventListener('click',function(){var n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);selected=ymd(n);render()});

function toast(msg){
  var t=document.createElement('div');t.className='toast';
  t.innerHTML='<span>'+esc(msg)+'</span><button type="button" aria-label="Tutup">×</button>';
  t.querySelector('button').addEventListener('click',function(){t.remove()});
  $('toasts').appendChild(t);
  setTimeout(function(){t.remove()},15000);
}
function notify(t){
  var p=t.date.split('-'),msg='Reminder! '+t.title+' Deadline is '+p[2]+'/'+p[1]+'/'+p[0];
  toast(msg);
  try{if('Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker){navigator.serviceWorker.getRegistration().then(function(r){if(r){r.showNotification('Task Reminder',{body:msg,tag:t.id,icon:'icon-192.png',badge:'icon-192.png'})}else{new Notification('Task Reminder',{body:msg,tag:t.id})}}).catch(function(){})}else{new Notification('Task Reminder',{body:msg,tag:t.id})}}}catch(e){}
}
function checkReminders(){
  var now=Date.now(),dirty=false;
  tasks.forEach(function(t){
    if(t.done||t.notified||!t.on)return;
    if(now>=remindAt(t).getTime()&&now<=due(t).getTime()){t.notified=true;dirty=true;notify(t)}
  });
  if(dirty){save();render()}
}
setInterval(checkReminders,15000);
setInterval(function(){render()},60000);

function updateNotifBtn(){
  var b=$('notifBtn');
  if(!('Notification' in window)){b.style.display='none';return}
  if(Notification.permission==='granted'){b.textContent='Notifikasi aktif';b.disabled=true}
  else if(Notification.permission==='denied'){b.textContent='Notifikasi diblokir browser';b.disabled=true}
}
$('notifBtn').addEventListener('click',function(){
  try{Notification.requestPermission().then(updateNotifBtn)}catch(e){toast('Browser ini tidak mendukung notifikasi. Pengingat tetap muncul di halaman.')}
});
updateNotifBtn();render();checkReminders();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
